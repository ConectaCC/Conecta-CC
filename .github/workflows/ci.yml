name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o teste de mutação compara com a base do PR
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: pcov
      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Testes, com cobertura de linhas de 100%
        run: vendor/bin/pest --parallel --coverage --min=100
      - name: Teste de mutação nas classes alteradas (nota mínima 90%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          classes=$(../scripts/changed-php-classes.sh "origin/$BASE_REF")
          if [ -z "$classes" ]; then echo "Nenhuma classe de backend/app alterada."; exit 0; fi
          vendor/bin/pest --mutate --class="$classes" --covered-only --parallel --min=90
      - name: OpenAPI versionado está atualizado
        env:
          APP_URL: http://localhost
        run: |
          # os testes em paralelo usam bancos próprios: o Scramble precisa do esquema para tipar os campos
          php artisan migrate --force
          php artisan scramble:export --path=storage/app/openapi.json
          diff -u ../frontend/openapi.json storage/app/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o teste de mutação compara com a base do PR
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Teste de mutação nas linhas alteradas (nota mínima 80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          lines=$(../scripts/changed-front-lines.sh "origin/$BASE_REF")
          if [ -z "$lines" ]; then echo "Nenhuma linha de frontend/src alterada."; exit 0; fi
          npm run mutate -- --mutate "$lines"
      - name: Tipos da API gerados do OpenAPI versionado
        run: |
          npm run api-types
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --verbose
